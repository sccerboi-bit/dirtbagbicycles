<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIRTBAG BICYCLES</title>
  <meta name="description" content="Dirtbag Bicycles. South Orange County, CA. Apparel and MTB.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0A0A0A;
      color: #F5F0EB;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .page {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 80px;
      padding-bottom: 60px;
    }

    /* Logo / Wordmark */
    .logo {
      margin-bottom: 48px;
    }

    .logo h1 {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(42px, 10vw, 64px);
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      color: #F5F0EB;
    }

    .logo h1 .sub {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #666;
      margin-top: 10px;
    }

    /* One line */
    .oneliner {
      font-size: 14px;
      line-height: 1.6;
      color: #999;
      margin-bottom: 48px;
      max-width: 360px;
    }

    /* Links stack */
    .links {
      display: flex;
      flex-direction: column;
      gap: 1px;
      margin-bottom: 48px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      text-decoration: none;
      font-family: 'Archivo Black', sans-serif;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #222;
      transition: color 0.15s;
    }

    .links a:first-child {
      border-top: 1px solid #222;
    }

    .links a:hover {
      color: #fff;
    }

    .links a .arrow {
      font-size: 18px;
      color: #444;
      transition: color 0.15s, transform 0.15s;
    }

    .links a:hover .arrow {
      color: #F5F0EB;
      transform: translateX(4px);
    }

    .links .tag {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      color: #555;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Signup */
    .signup {
      margin-bottom: 48px;
    }

    .signup-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #555;
      margin-bottom: 12px;
    }

    .signup-form {
      display: flex;
      gap: 0;
    }

    .signup-form input {
      flex: 1;
      padding: 14px 16px;
      background: #141414;
      border: 1px solid #333;
      border-right: none;
      color: #F5F0EB;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .signup-form input::placeholder {
      color: #444;
    }

    .signup-form input:focus {
      border-color: #666;
    }

    .signup-form button {
      padding: 14px 20px;
      background: #F5F0EB;
      color: #0A0A0A;
      border: 1px solid #F5F0EB;
      font-family: 'Archivo Black', sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    .signup-form button:hover {
      opacity: 0.85;
    }

    .signup-success {
      display: none;
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }

    /* Trails */
    .trails {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #333;
      line-height: 2.2;
    }

    .trails span::after {
      content: ' — ';
      color: #222;
    }

    .trails span:last-child::after {
      content: '';
    }

    /* Footer */
    footer {
      padding: 24px 20px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #333;
    }

    @media (max-width: 480px) {
      .page {
        padding-top: 48px;
        padding-bottom: 40px;
      }

      .signup-form {
        flex-direction: column;
        gap: 0;
      }

      .signup-form input {
        border-right: 1px solid #333;
        border-bottom: none;
      }

      .signup-form button {
        padding: 16px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="page">

    <div class="logo">
      <h1>
        Dirtbag<br>Bicycles
        <span class="sub">South Orange County, CA</span>
      </h1>
    </div>

    <p class="oneliner">Apparel and goods for people who ride dirt.</p>

    <nav class="links">
      <a href="https://instagram.com/dirtbag.bicycles" target="_blank" rel="noopener">
        <span>Instagram</span>
        <span class="arrow">&rarr;</span>
      </a>
      <a href="#" onclick="return false;">
        <span>Shop</span>
        <span class="tag">Soon</span>
      </a>
      <a href="#" onclick="return false;">
        <span>Tees &amp; Shirts</span>
        <span class="tag">Soon</span>
      </a>
      <a href="#" onclick="return false;">
        <span>Socks</span>
        <span class="tag">Soon</span>
      </a>
    </nav>

    <div class="signup">
      <p class="signup-label">Get notified when we drop</p>
      <form class="signup-form" id="signup-form">
        <input type="email" name="email" placeholder="email" required>
        <button type="submit">Submit</button>
      </form>
      <p class="signup-success" id="signup-success">You're on the list.</p>
    </div>

    <div class="trails">
      <span>Aliso Woods</span>
      <span>Las Ramblas</span>
      <span>Laguna</span>
      <span>San Clemente</span>
      <span>Black Star</span>
    </div>

  </div>

  <footer>Dirtbag Bicycles</footer>

  <script>
    const form = document.getElementById('signup-form');
    const success = document.getElementById('signup-success');
    const btn = form.querySelector('button');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.querySelector('input[type="email"]').value;
      btn.textContent = '...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        if (res.ok) {
          form.style.display = 'none';
          success.style.display = 'block';
        } else {
          btn.textContent = 'Try again';
          btn.disabled = false;
        }
      } catch {
        btn.textContent = 'Try again';
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
